services:
  frontend:
    container_name: luisardito-web
    image: luisardito-frontend:production
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - ${HOME}/.env.luisardito-frontend.production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/es').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
