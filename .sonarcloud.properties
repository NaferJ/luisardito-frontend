# SonarCloud automatic analysis configuration
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/

# Source files (exclude generated files, build output, and content directories)
sonar.sources=src
sonar.exclusions=src/content/**,package-lock.json,**/*.min.js,**/*.map,**/dist/**,**/.next/**

# No test framework configured yet
sonar.tests=
